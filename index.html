<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
        }

        .scene {
            position: relative;
            width: 100%;
        }

        .house {
            display: block;
            width: 100%;
            height: auto;
        }

        .room-link {
            position: absolute;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            border: 0;
            background: transparent;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-size: clamp(0.9rem, 1vw, 1.4rem);
            transition: transform 0.2s ease;
        }

        .room-link:hover {
            transform: scale(1.05);
        }

     .living-room {
    left: 5%;
    top: 57%;
    width: 37%;
    height: 27%;
}

.garage {
    left: 61%;
    top: 57%;
    width: 33%;
    height: 27%;
}

        .bedroom {
            left: 6.3%;
            top: 28.8%;
            width: 33%;
            height: 25.2%;
        }

        .gaming-room {
            left: 61%;
            top: 29%;
            width: 33%;
            height: 25%;
        }

        .room-link:focus-visible {
            outline: 3px solid white;
            outline-offset: -4px;
        }
    </style>
</head>
<body>
    <main class="scene">
        <img class="house" src="house.png" alt="House floor plan">
        <a class="room-link living-room" href="living-room.html">Living Room</a>
        <a class="room-link bedroom" href="bedroom.html">Bedroom</a>
        <a class="room-link gaming-room" href="gaming-room.html">Gaming Room</a>
        <a class="room-link garage" href="garage.html">Garage</a>
    </main>
</body>
</html>
