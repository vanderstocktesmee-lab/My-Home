<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home</title>
    <style>
        body {
            margin: 0;
        }
        .scene {
            position: relative;
            width: 100%;
        }
        .house {
            display: block;
            width: 100%;
            height: auto;
        }
        .bedroom {
            position: absolute;
            left: 6.3%;
            top: 28.8%;
            width: 33%;
            height: 25.2%;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            border: 0;
            background: transparent;
            color: white;
            cursor: pointer;
        }
    
        }
        .bedroom:focus-visible {
            outline: 3px solid white;
            outline-offset: -4px;
        }
        .gaming-roomUwU:focus-visible {
            outline: 3px solid white;
            outline-offset: -4px;
        }

        .gaming-roomUwU {
           position: absolute;
           left: 61%;
           top: 29%;
           width: 33%
           color: white;
           height: 25%;
           display: grid;
           place-items: center;
           box-sizing: border-box;
           text-decoration: none;
           
            
        }
    </style>
</head>
<body>
    <main class="scene">
        <img class="house" src="house.png" alt="">
        <a class="bedroom" href="bedroom.html">Bedroom</a>
        <a class="gaming-roomUwU" href="gaming-room.html">Gaming Room</a>
    </main>

</html>
